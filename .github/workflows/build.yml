name: Build GBA ROMs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gba-native-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test SPLB20 link hook dispatch
        run: python3 gba/host/test_pc_hook_fastpath.py

      - name: Test Elfin logical link flow
        run: python3 gba/host/test_native_link_flow.py

      - name: Test native link transport
        run: |
          gcc -O2 -Wall -Wextra -std=gnu11 \
            gba/host/test_gba_link_protocol.c gba/common/gba_link.c \
            -o /tmp/test_gba_link_protocol
          /tmp/test_gba_link_protocol

      - name: Build with devkitARM
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            /bin/bash -lc 'make -C gba/elfin && make -C gba/linktest'

      - name: Test two real ROM instances in mGBA multiplayer
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://s3.amazonaws.com/mgba/mGBA-build-latest-appimage-x64.appimage \
            -o /tmp/mgba.appimage
          chmod +x /tmp/mgba.appimage
          (cd /tmp && ./mgba.appimage --appimage-extract >/dev/null)
          MGBA_QT=/tmp/squashfs-root/usr/bin/mgba-qt
          if [ ! -x "$MGBA_QT" ]; then
            MGBA_QT=$(find /tmp/squashfs-root -type f -name 'mgba-qt' -perm -111 | head -1)
          fi
          test -x "$MGBA_QT"

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb openbox xdotool imagemagick \
            libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

          "$MGBA_QT" --version | tee /tmp/mgba-version.txt

          rm -f /tmp/mgba-*.png /tmp/mgba-windows.txt /tmp/mgba-ui.log
          timeout 25s xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            set -euo pipefail
            openbox >/tmp/openbox.log 2>&1 &
            obpid=$!
            trap "kill $obpid 2>/dev/null || true" EXIT

            "'"$MGBA_QT"'" \
              "'"$GITHUB_WORKSPACE"'/gba/linktest/elfin-linktest.gba" \
              "'"$GITHUB_WORKSPACE"'/gba/linktest/elfin-linktest.gba" \
              >/tmp/mgba-ui.log 2>&1 &
            mpid=$!
            trap "kill $mpid $obpid 2>/dev/null || true" EXIT

            for i in $(seq 1 100); do
              mapfile -t wins < <(xdotool search --onlyvisible --name "mGBA" 2>/dev/null || true)
              if [ "${#wins[@]}" -ge 2 ]; then break; fi
              sleep 0.1
            done

            xwininfo -root -tree > /tmp/mgba-windows.txt
            mapfile -t wins < <(xdotool search --onlyvisible --name "mGBA" 2>/dev/null || true)
            printf "window_count=%d\n" "${#wins[@]}" >> /tmp/mgba-windows.txt
            [ "${#wins[@]}" -ge 2 ]

            w0="${wins[0]}"
            w1="${wins[1]}"
            printf "w0=%s title=%s\n" "$w0" "$(xdotool getwindowname "$w0")" >> /tmp/mgba-windows.txt
            printf "w1=%s title=%s\n" "$w1" "$(xdotool getwindowname "$w1")" >> /tmp/mgba-windows.txt

            xdotool windowmove "$w0" 20 20 windowsize "$w0" 500 390 || true
            xdotool windowmove "$w1" 650 20 windowsize "$w1" 500 390 || true
            sleep 4

            import -window "$w0" /tmp/mgba-player0-before.png
            import -window "$w1" /tmp/mgba-player1-before.png

            # mGBA default keyboard map: X = GBA A. Send A to both instances;
            # either role may queue DATA, and the parent clocks the shared bus.
            for w in "$w0" "$w1"; do
              xdotool keydown --window "$w" x
              sleep 0.20
              xdotool keyup --window "$w" x
            done
            sleep 3

            import -window "$w0" /tmp/mgba-player0-after.png
            import -window "$w1" /tmp/mgba-player1-after.png
            import -window root /tmp/mgba-both-after.png

            test -s /tmp/mgba-player0-after.png
            test -s /tmp/mgba-player1-after.png

            xdotool windowclose "$w0" || true
            xdotool windowclose "$w1" || true
            sleep 1
            kill "$mpid" 2>/dev/null || true
            wait "$mpid" 2>/dev/null || true
          '

          cat /tmp/mgba-windows.txt
          cat /tmp/mgba-ui.log || true

      - name: Upload mGBA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgba-multiplayer-evidence
          if-no-files-found: warn
          path: |
            /tmp/mgba-version.txt
            /tmp/mgba-windows.txt
            /tmp/mgba-ui.log
            /tmp/openbox.log
            /tmp/mgba-player0-before.png
            /tmp/mgba-player1-before.png
            /tmp/mgba-player0-after.png
            /tmp/mgba-player1-after.png
            /tmp/mgba-both-after.png

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: elfin-twins-gba-native-link
          path: |
            gba/elfin/elfin-twins.gba
            gba/linktest/elfin-linktest.gba
