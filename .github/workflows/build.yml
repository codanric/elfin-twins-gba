name: Build GBA ROMs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Include the checked-out commit so a wedged emulator job cannot block a
  # newer diagnostic run. Stale runs can finish independently.
  group: gba-native-link-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test SPLB20 link hook dispatch
        run: python3 gba/host/test_pc_hook_fastpath.py

      - name: Test Elfin logical link flow
        run: python3 gba/host/test_native_link_flow.py

      - name: Test native link transport
        run: |
          gcc -O2 -Wall -Wextra -std=gnu11 \
            gba/host/test_gba_link_protocol.c gba/common/gba_link.c \
            -o /tmp/test_gba_link_protocol
          /tmp/test_gba_link_protocol

      - name: Build with devkitARM
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            /bin/bash -lc 'make -C gba/elfin && make -C gba/linktest'

      - name: Test two real ROM instances in mGBA multiplayer
        timeout-minutes: 4
        run: |
          set -euo pipefail

          # Resolve the actual ROM-state addresses from the just-built ELF.
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            /bin/bash -lc 'arm-none-eabi-nm -n gba/linktest/build/elfin-linktest.elf' \
            > /tmp/linktest.nm

          export LINK_BASE=$(awk '$3 == "link" {print $1; exit}' /tmp/linktest.nm)
          export APP_RX_ADDR=$(awk '$3 == "app_rx_count" {print $1; exit}' /tmp/linktest.nm)
          export APP_LAST_ADDR=$(awk '$3 == "app_last_count" {print $1; exit}' /tmp/linktest.nm)
          test -n "$LINK_BASE"
          test -n "$APP_RX_ADDR"
          test -n "$APP_LAST_ADDR"

          cat >/tmp/link-layout.c <<'EOF'
          #include <stddef.h>
          #include <stdio.h>
          #include "gba/common/gba_link.h"
          int main(void) {
              printf("OFF_READY=%zu\n", offsetof(gba_link_t, ready));
              printf("OFF_PARENT=%zu\n", offsetof(gba_link_t, parent));
              printf("OFF_PEER=%zu\n", offsetof(gba_link_t, peer_seen));
              printf("OFF_FRAMES_RX=%zu\n", offsetof(gba_link_t, frames_rx));
              printf("OFF_FRAMES_TX=%zu\n", offsetof(gba_link_t, frames_tx));
              printf("OFF_ERRORS=%zu\n", offsetof(gba_link_t, sio_errors));
              return 0;
          }
          EOF
          gcc -I. /tmp/link-layout.c -o /tmp/link-layout
          while IFS='=' read -r k v; do export "$k=$v"; done < <(/tmp/link-layout)

          curl -fL --retry 3 \
            https://s3.amazonaws.com/mgba/mGBA-build-latest-appimage-x64.appimage \
            -o /tmp/mgba.appimage
          chmod +x /tmp/mgba.appimage
          (cd /tmp && ./mgba.appimage --appimage-extract >/dev/null)
          MGBA_QT=/tmp/squashfs-root/usr/bin/mgba-qt
          if [ ! -x "$MGBA_QT" ]; then
            MGBA_QT=$(find /tmp/squashfs-root -type f -name 'mgba-qt' -perm -111 | head -1)
          fi
          test -x "$MGBA_QT"

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

          "$MGBA_QT" --version | tee /tmp/mgba-version.txt
          rm -f /tmp/mgba-probe-*.txt /tmp/mgba-probe-*.png /tmp/mgba-ui.log

          set +e
          timeout 10s xvfb-run -a "$MGBA_QT" \
            --script "$GITHUB_WORKSPACE/gba/host/mgba_link_probe.lua" \
            "$GITHUB_WORKSPACE/gba/linktest/elfin-linktest.gba" \
            "$GITHUB_WORKSPACE/gba/linktest/elfin-linktest.gba" \
            >/tmp/mgba-ui.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/mgba-ui.log
            exit "$rc"
          fi

          cat /tmp/mgba-ui.log || true
          ls -l /tmp/mgba-probe-*.txt /tmp/mgba-probe-*.png
          cat /tmp/mgba-probe-*.txt

          python3 - <<'PY'
          import glob

          reports = {}
          for path in glob.glob('/tmp/mgba-probe-*.txt'):
              d = {}
              with open(path) as f:
                  for line in f:
                      k, v = line.strip().split('=', 1)
                      d[k] = int(v, 16) if k == 'sio' else int(v)
              reports[d['player']] = d

          assert set(reports) == {0, 1}, reports
          p0, p1 = reports[0], reports[1]

          assert p0['parent'] == 1, reports
          assert p1['parent'] == 0, reports
          assert p0['ready'] == p1['ready'] == 1, reports
          assert p0['peer'] == p1['peer'] == 1, reports
          assert p0['sio_errors'] == p1['sio_errors'] == 0, reports

          # The Lua probe presses A only on player 0. In the link-test ROM that
          # queues Elfin count 10. Player 1 must actually consume that value.
          assert p0['frames_tx'] >= 1, reports
          assert p1['frames_rx'] >= 1, reports
          assert p1['app_rx'] >= 1, reports
          assert p1['app_last'] == 10, reports

          print('PASS: mGBA multiplayer carried Elfin DATA 10 from P0 to P1')
          PY

      - name: Upload mGBA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgba-multiplayer-evidence
          if-no-files-found: warn
          path: |
            /tmp/mgba-version.txt
            /tmp/mgba-ui.log
            /tmp/mgba-probe-*.txt
            /tmp/mgba-probe-*.png
            /tmp/linktest.nm

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: elfin-twins-gba-native-link
          path: |
            gba/elfin/elfin-twins.gba
            gba/linktest/elfin-linktest.gba
