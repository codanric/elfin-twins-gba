name: Build GBA ROMs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gba-native-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Test SPLB20 link hook dispatch
        run: python3 gba/host/test_pc_hook_fastpath.py

      - name: Test Elfin logical link flow
        run: python3 gba/host/test_native_link_flow.py

      - name: Test native link transport
        run: |
          gcc -O2 -Wall -Wextra -std=gnu11 \
            gba/host/test_gba_link_protocol.c gba/common/gba_link.c \
            -o /tmp/test_gba_link_protocol
          /tmp/test_gba_link_protocol

      - name: Build with devkitARM
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            /bin/bash -lc 'make -C gba/elfin && make -C gba/linktest'

      - name: Locate link-test state in ELF
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            devkitpro/devkitarm:latest \
            /opt/devkitpro/devkitARM/bin/arm-none-eabi-nm \
            gba/linktest/build/elfin-linktest.elf \
            | awk '$3 == "link" { print $1; exit }' \
            > /tmp/link.addr
          test -s /tmp/link.addr
          echo "LINK_BASE=$(cat /tmp/link.addr)" >> "$GITHUB_ENV"

          cat >/tmp/link-layout.c <<'EOF'
          #include <stddef.h>
          #include <stdio.h>
          #include "gba/common/gba_link.h"
          int main(void) {
              printf("OFF_READY=%zu\\n", offsetof(gba_link_t, ready));
              printf("OFF_PARENT=%zu\\n", offsetof(gba_link_t, parent));
              printf("OFF_PEER=%zu\\n", offsetof(gba_link_t, peer_seen));
              printf("OFF_FRAMES_RX=%zu\\n", offsetof(gba_link_t, frames_rx));
              printf("OFF_FRAMES_TX=%zu\\n", offsetof(gba_link_t, frames_tx));
              printf("OFF_ERRORS=%zu\\n", offsetof(gba_link_t, sio_errors));
              return 0;
          }
          EOF
          gcc -I. /tmp/link-layout.c -o /tmp/link-layout
          /tmp/link-layout >> "$GITHUB_ENV"

      - name: Test two real ROM instances in mGBA multiplayer
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://s3.amazonaws.com/mgba/mGBA-build-latest-appimage-x64.appimage \
            -o /tmp/mgba.appimage
          chmod +x /tmp/mgba.appimage
          (cd /tmp && ./mgba.appimage --appimage-extract >/dev/null)
          MGBA_QT=/tmp/squashfs-root/usr/bin/mgba-qt
          if [ ! -x "$MGBA_QT" ]; then
            MGBA_QT=$(find /tmp/squashfs-root -type f -name 'mgba-qt' -perm -111 | head -1)
          fi
          test -x "$MGBA_QT"

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0
          "$MGBA_QT" --version
          "$MGBA_QT" --help >/tmp/mgba-help.txt 2>&1 || true
          cat /tmp/mgba-help.txt
          grep -q -- '--script' /tmp/mgba-help.txt

          rm -f /tmp/mgba-probe-*.txt /tmp/mgba-probe-*.png /tmp/mgba-script-trace.txt
          set +e
          timeout 6s xvfb-run -a "$MGBA_QT" \
            --script "$GITHUB_WORKSPACE/gba/host/mgba_link_probe.lua" \
            "$GITHUB_WORKSPACE/gba/linktest/elfin-linktest.gba" \
            >/tmp/mgba-single.log 2>&1
          single_rc=$?
          set -e
          if [ "$single_rc" -ne 0 ] && [ "$single_rc" -ne 124 ]; then
            cat /tmp/mgba-single.log
            exit "$single_rc"
          fi
          cat /tmp/mgba-single.log || true
          test -s /tmp/mgba-script-trace.txt
          cp /tmp/mgba-script-trace.txt /tmp/mgba-single-trace.txt

          rm -f /tmp/mgba-probe-*.txt /tmp/mgba-probe-*.png /tmp/mgba-script-trace.txt
          set +e
          timeout 20s xvfb-run -a "$MGBA_QT" \
            --script "$GITHUB_WORKSPACE/gba/host/mgba_link_probe.lua" \
            "$GITHUB_WORKSPACE/gba/linktest/elfin-linktest.gba" \
            "$GITHUB_WORKSPACE/gba/linktest/elfin-linktest.gba" \
            >/tmp/mgba.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/mgba.log
            exit "$rc"
          fi

          cat /tmp/mgba.log || true
          ls -l /tmp/mgba-probe-*.txt
          cat /tmp/mgba-probe-*.txt

          python3 - <<'PY'
          import glob
          reports = []
          for path in sorted(glob.glob('/tmp/mgba-probe-*.txt')):
              d = {}
              with open(path) as f:
                  for line in f:
                      k, v = line.strip().split('=', 1)
                      d[k] = int(v, 16) if k == 'sio' else int(v)
              reports.append(d)

          assert len(reports) == 2, reports
          assert sorted(r['player'] for r in reports) == [0, 1], reports
          assert all(r['ready'] == 1 for r in reports), reports
          assert all(r['peer'] == 1 for r in reports), reports
          assert all(r['sio_errors'] == 0 for r in reports), reports

          parents = [r for r in reports if r['parent']]
          children = [r for r in reports if not r['parent']]
          assert len(parents) == 1 and len(children) == 1, reports
          assert parents[0]['frames_tx'] >= 1, reports
          assert children[0]['frames_rx'] >= 1, reports
          print('PASS: mGBA two-ROM multiplayer SIO transferred DATA and ACK')
          PY

      - name: Upload mGBA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgba-multiplayer-evidence
          if-no-files-found: warn
          path: |
            /tmp/mgba-help.txt
            /tmp/mgba-single.log
            /tmp/mgba-single-trace.txt
            /tmp/mgba.log
            /tmp/mgba-script-trace.txt
            /tmp/mgba-probe-*.txt
            /tmp/mgba-probe-*.png

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: elfin-twins-gba-native-link
          path: |
            gba/elfin/elfin-twins.gba
            gba/linktest/elfin-linktest.gba
