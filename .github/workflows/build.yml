name: Build GBA ROMs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi

      - name: Build Elfin Twins
        run: make -C gba/elfin

      - name: Build link test ROM
        run: make -C gba/linktest
