# Publishes a GitHub release when a version tag (v1.0, v1.1, ...) is pushed,
# or when the workflow is run by hand with a version (Actions > Release > Run
# workflow); the tag is then created on the current commit of main.
# The prebuilt ROMs and PDFs in the repository are attached as downloads;
# the ROMs are then rebuilt from source to check they match.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          notes=".github/release-notes/${VERSION}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Elfin Twins GM-021 for GBA ${VERSION}" \
            --notes-file "$notes" \
            gba/release/elfin-twins.gba \
            gba/release/elfin-linktest.gba \
            gba/docs/Elfin_Twins_GM-021_Manual.pdf \
            gba/docs/Elfin_Twins_GM-021_Technical_Reference.pdf

      - name: Rebuild the ROMs from source and compare
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi
          make -C gba/elfin
          make -C gba/linktest
          cmp gba/elfin/elfin-twins.gba gba/release/elfin-twins.gba
          cmp gba/linktest/elfin-linktest.gba gba/release/elfin-linktest.gba
          echo "Rebuilt ROMs are identical to the released ones."
